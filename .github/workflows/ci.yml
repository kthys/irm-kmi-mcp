name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run tests
        run: uv run --no-project pytest --cov=irm_kmi_mcp --cov-fail-under=90

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Ruff check
        run: uv run --no-project ruff check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Check py.typed is packaged in the wheel
        run: unzip -l dist/*.whl | grep -q 'irm_kmi_mcp/py.typed'
      - name: Install wheel into a fresh environment outside the repo
        run: |
          uv venv "$RUNNER_TEMP/pkg-venv"
          uv pip install --python "$RUNNER_TEMP/pkg-venv" "$GITHUB_WORKSPACE"/dist/*.whl
      - name: Smoke test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/pkg-venv/bin:$PATH"
          python -c "from irm_kmi_mcp.server import create_server; create_server()"
          command -v irm-kmi-mcp
      - name: Twine check
        run: uvx twine check dist/*
