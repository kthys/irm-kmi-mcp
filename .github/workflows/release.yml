name: Release

on:
  push:
    tags: ["v*"]

# No default permissions; each job requests only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway through a publish.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run --no-project pytest --cov=irm_kmi_mcp --cov-fail-under=90

      - name: Build sdist and wheel
        run: uv build

      - name: Check package hygiene
        run: |
          tar -tzf dist/*.tar.gz > sdist-files.txt
          unzip -Z1 dist/*.whl > wheel-files.txt
          echo "--- sdist contents ---"; cat sdist-files.txt
          echo "--- wheel contents ---"; cat wheel-files.txt

          # No secrets, VCS data, caches, or junk in either archive.
          FORBIDDEN='(^|/)(\.env[^/]*|\.git[^/]*|\.venv|__pycache__|node_modules|\.DS_Store|[^/]*\.(pyc|pyo|pem|key|p12|pfx|sqlite3?|log))(/|$)'
          if grep -EHi "$FORBIDDEN" sdist-files.txt wheel-files.txt; then
            echo "::error::Forbidden files found in the distribution archives"
            exit 1
          fi

          # The wheel must contain nothing but the package and its dist-info.
          if grep -Ev '^irm_kmi_mcp(/|-[0-9][^/]*\.dist-info/)' wheel-files.txt; then
            echo "::error::Unexpected top-level files in the wheel"
            exit 1
          fi

          # Type marker must ship with the wheel.
          grep -qx 'irm_kmi_mcp/py.typed' wheel-files.txt

      - name: Twine check
        run: uvx twine check --strict dist/*

      - name: Smoke test the wheel in a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/pkg-venv"
          uv pip install --python "$RUNNER_TEMP/pkg-venv" "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/pkg-venv/bin:$PATH"
          python -c "from irm_kmi_mcp.server import create_server; create_server()"
          command -v irm-kmi-mcp

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/irm-kmi-mcp/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token, no secret.
      id-token: write
    steps:
      # Deliberately no checkout: this job only ever touches the built artifacts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
